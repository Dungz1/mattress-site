<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1024px; height: 1024px; overflow: hidden; }
  .canvas {
    position: relative; width: 1024px; height: 1024px;
    background: #0f1420;
    display: flex; align-items: center; justify-content: center;
    font-family: "Fraunces", Georgia, serif;
  }
  /* quilted texture */
  .canvas::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(45deg, rgba(244,237,221,0.05) 0 1px, transparent 1px 30px),
      repeating-linear-gradient(-45deg, rgba(244,237,221,0.05) 0 1px, transparent 1px 30px);
  }
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 70% 60% at 50% 105%, rgba(87,217,163,0.16), transparent 70%);
  }
  .ring {
    position: absolute; inset: 36px; border-radius: 50%;
    border: 5px solid rgba(87, 217, 163, 0.8);
  }
  .ring::after {
    content: ""; position: absolute; inset: 18px; border-radius: 50%;
    border: 2px solid rgba(244, 237, 221, 0.18);
  }
  .mark { position: relative; text-align: center; }

  /* CSS mattress icon */
  .bed-icon {
    position: relative; width: 380px; height: 190px; margin: 0 auto;
  }
  .mattress {
    position: absolute; left: 0; right: 0; bottom: 26px; height: 120px;
    background: linear-gradient(180deg, #f4eddd, #d9cfb8);
    border-radius: 34px;
    box-shadow: 0 24px 50px rgba(0,0,0,0.5), inset 0 -14px 26px rgba(15,20,32,0.18);
  }
  .mattress::before {
    content: ""; position: absolute; inset: 14px;
    border: 2.5px dashed rgba(15,20,32,0.35); border-radius: 22px;
  }
  .mattress::after {
    content: ""; position: absolute; inset: 26px;
    background-image:
      repeating-linear-gradient(45deg, rgba(15,20,32,0.12) 0 1.5px, transparent 1.5px 34px),
      repeating-linear-gradient(-45deg, rgba(15,20,32,0.12) 0 1.5px, transparent 1.5px 34px);
    border-radius: 14px;
  }
  .pillow {
    position: absolute; left: 34px; bottom: 108px; width: 120px; height: 62px;
    background: linear-gradient(180deg, #fffaf0, #e8dfc8);
    border-radius: 26px; transform: rotate(-4deg);
    box-shadow: 0 10px 22px rgba(0,0,0,0.35);
  }
  .bill {
    position: absolute; width: 92px; height: 48px; border-radius: 8px;
    background: linear-gradient(135deg, #57d9a3, #2e9e73);
    border: 2px solid rgba(244,237,221,0.55);
    box-shadow: 0 10px 22px rgba(0,0,0,0.4);
  }
  .bill::after {
    content: "$"; position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    color: #0f1420; font-family: "IBM Plex Mono", monospace;
    font-size: 26px; font-weight: 700;
  }
  .b1 { right: 18px; bottom: 132px; transform: rotate(14deg); }
  .b2 { right: 68px; bottom: 156px; transform: rotate(-10deg); }

  .word {
    margin-top: 40px;
    font-family: "Fraunces", Georgia, serif; font-weight: 700;
    font-size: 104px; letter-spacing: 0.015em; color: #f4eddd; line-height: 1;
  }
  .word .dot { color: #57d9a3; }
  .tick {
    margin-top: 22px;
    font-family: "IBM Plex Mono", monospace; font-size: 42px;
    letter-spacing: 0.18em; text-indent: 0.18em; color: #57d9a3;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow"></div>
    <div class="ring"></div>
    <div class="mark">
      <div class="bed-icon">
        <div class="mattress"></div>
        <div class="pillow"></div>
        <div class="bill b1"></div>
        <div class="bill b2"></div>
      </div>
      <div class="word">THE MATTRESS<span class="dot">.</span></div>
      <div class="tick">$MATTRESS</div>
    </div>
  </div>
</body>
</html>
