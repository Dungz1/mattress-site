<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1500px; height: 500px; overflow: hidden; }
  .canvas {
    position: relative; width: 1500px; height: 500px;
    background: #0f1420;
    display: flex; align-items: center;
    padding: 0 92px; box-sizing: border-box;
    font-family: "Fraunces", Georgia, serif; color: #f4eddd;
  }
  .canvas::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(45deg, rgba(244,237,221,0.05) 0 1px, transparent 1px 30px),
      repeating-linear-gradient(-45deg, rgba(244,237,221,0.05) 0 1px, transparent 1px 30px);
  }
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 42% 85% at 82% 55%, rgba(87,217,163,0.14), transparent 70%);
  }
  .rule { position: absolute; left: 92px; right: 92px; height: 1px; background: rgba(87,217,163,0.32); }
  .rule.top { top: 44px; } .rule.bottom { bottom: 44px; }

  .kicker {
    font-family: "IBM Plex Mono", monospace; font-size: 18px;
    letter-spacing: 0.28em; text-transform: uppercase; color: #57d9a3;
    margin-bottom: 20px;
  }
  h1 {
    font-weight: 700; font-size: 84px; line-height: 1.04; letter-spacing: 0.01em;
    margin: 0;
  }
  h1 .green { color: #57d9a3; }
  .sub {
    margin-top: 22px;
    font-family: "IBM Plex Mono", monospace; font-size: 23px;
    letter-spacing: 0.12em; color: #cfc7b2;
  }
  .sub b { color: #57d9a3; font-weight: 500; }

  /* mattress art right side */
  .bed-art { position: absolute; right: 96px; top: 50%; transform: translateY(-50%); width: 360px; height: 220px; }
  .mattress {
    position: absolute; left: 0; right: 0; bottom: 30px; height: 116px;
    background: linear-gradient(180deg, #f4eddd, #d9cfb8);
    border-radius: 32px;
    box-shadow: 0 24px 50px rgba(0,0,0,0.5), inset 0 -14px 26px rgba(15,20,32,0.18);
  }
  .mattress::before {
    content: ""; position: absolute; inset: 13px;
    border: 2.5px dashed rgba(15,20,32,0.35); border-radius: 21px;
  }
  .pillow {
    position: absolute; left: 30px; bottom: 108px; width: 112px; height: 56px;
    background: linear-gradient(180deg, #fffaf0, #e8dfc8);
    border-radius: 24px; transform: rotate(-4deg);
    box-shadow: 0 10px 22px rgba(0,0,0,0.35);
  }
  .bill {
    position: absolute; width: 84px; height: 44px; border-radius: 8px;
    background: linear-gradient(135deg, #57d9a3, #2e9e73);
    border: 2px solid rgba(244,237,221,0.55);
    box-shadow: 0 10px 22px rgba(0,0,0,0.4);
  }
  .bill::after {
    content: "$"; position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    color: #0f1420; font-family: "IBM Plex Mono", monospace;
    font-size: 22px; font-weight: 700;
  }
  .b1 { right: 14px; bottom: 128px; transform: rotate(14deg); }
  .b2 { right: 62px; bottom: 150px; transform: rotate(-10deg); }

  .brand {
    position: absolute; top: 60px; left: 92px;
    font-family: "IBM Plex Mono", monospace; font-size: 17px;
    letter-spacing: 0.3em; color: #57d9a3;
  }
  .links {
    position: absolute; bottom: 60px; right: 92px;
    font-family: "IBM Plex Mono", monospace; font-size: 17px;
    letter-spacing: 0.14em; color: #cfc7b2;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow"></div>
    <div class="rule top"></div><div class="rule bottom"></div>
    <div class="brand">$MATTRESS · ON FOBO</div>
    <div class="links">themattress.fun</div>

    <div>
      <div class="kicker">The floor is a mattress</div>
      <h1>You're never the<br><span class="green">exit liquidity.</span></h1>
      <div class="sub"><b>$MATTRESS</b> — the money sleeps under you 🛏️</div>
    </div>

    <div class="bed-art">
      <div class="mattress"></div>
      <div class="pillow"></div>
      <div class="bill b1"></div>
      <div class="bill b2"></div>
    </div>
  </div>
</body>
</html>
